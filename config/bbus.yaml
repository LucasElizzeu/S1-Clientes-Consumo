# Preencha url, selectors e grafana com base em CAPTURAS REAIS (use: python -m velosonet snapshot --bbu 1).
# Nenhum seletor foi presumido: valores null bloqueiam a coleta com erro explícito.
defaults: &defaults
  user_env: BBU_USER
  pass_env: BBU_PASS
  keepalive: true
  tls_spki_sha256: null      # preencha com: python -m velosonet tls-pin --all  (certificado autoassinado da BBU)
  verify_tls: true          # mantenha true; se a BBU usa certificado próprio, instale a CA no SO/navegador
  url: null
  # PROVISÓRIO: derivado dos rótulos visíveis nas capturas (User name/Password/Login, Yes, MML, Assist, Exec).
  # NÃO testado contra a BBU real. Valide com: python -m velosonet capture --bbu 1 --command "DSP S1INTERFACE"
  # (gera screenshots e HTML de cada etapa em data/samples/trace/ para ajuste fino).
  selectors:
    username: 'input[type="text"]:visible'
    password: 'input[type="password"]'
    login_button: 'input[value="Login"], :text-is("Login")'
    confirm_yes: 'input[value="Yes"], :text-is("Yes")'        # aviso "Only authorized users..." após o login
    logged_in_indicator: ':text("Local User")'
    login_form_indicator: 'input[type="password"]'            # visível => sessão expirada
    mml_menu: 'div[style*="mml.gif"]'
    mml_command_input: '#mmlcmdtext___input'
    mml_assist_button: '#mmlassistbtn'
    mml_execute_button: '#mmlexecbtn'
    mml_output: "@all_frames"                                  # lê o texto de todos os frames; o código fatia a resposta

grafana_defaults:
  dashboard_uid: kokmJS2Dz          # cliente-velosonet-velosonet-4g-geral-v3 (orgId=2)
  panel_title: null                 # o painel é localizado pelo TÍTULO...
  panel_id: null
  allowed_panel_ids: [139, 358, 359, 377, 378, 384]   # ...e o id encontrado precisa estar nesta lista (informada por você)
  ref_id: null                      # null = primeiro target do painel
  metric: "não confirmado"          # CONFIRMAR: download | upload | agregado (ver: python -m velosonet grafana-panels)
  scale: null                       # null = deriva da unidade do painel (ex.: bps -> Mb/s); defina só se a unidade for desconhecida
  variables: {}
  max_age_s: 900

